version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: ticket-triage-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: ticket-triage-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
